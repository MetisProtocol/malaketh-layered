name: Release (malachitebft-eth-app)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate semver tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --locked

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          BIN="malachitebft-eth-app"
          SRC="target/release/${BIN}"
          test -f "${SRC}" || (echo "Missing ${SRC}" && exit 1)

          OUT="dist/${BIN}.linux-${{ matrix.arch }}"
          cp -v "${SRC}" "${OUT}"
          chmod +x "${OUT}"

          # Optional but recommended checksum
          (cd dist && sha256sum "$(basename "${OUT}")" > "$(basename "${OUT}").sha256")

      - name: Upload artifacts for release job
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f -maxdepth 2 -exec cp -v {} out/ \;
          ls -la out

      - name: Create/Update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/malachitebft-eth-app.linux-amd64
            out/malachitebft-eth-app.linux-amd64.sha256
            out/malachitebft-eth-app.linux-arm64
            out/malachitebft-eth-app.linux-arm64.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
